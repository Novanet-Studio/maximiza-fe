[build]
  command = "npm run build"
  publish = "dist"

[functions]
  external_node_modules = ["@sparticuz/chromium", "puppeteer-core"]
  node_bundler = "esbuild"

# The old Gatsby blog served every article with a trailing slash (/blog/<slug>/); the new
# blog drops it (/blog/<slug>). Confirmed the 10 old article slugs are unchanged in the new
# Kairos CMS, so a single splat rule covers all of them instead of listing each one.
[[redirects]]
  from = "/blog/:slug/"
  to = "/blog/:slug"
  status = 301

# 301s for pages dropped from the old Gatsby site's IA. Each old path is listed with and
# without its trailing slash, since the old site served everything with one and an inbound
# link may or may not include it.
[[redirects]]
  from = "/directiva/"
  to = "/empresa"
  status = 301

[[redirects]]
  from = "/directiva"
  to = "/empresa"
  status = 301

[[redirects]]
  from = "/responsabilidad/"
  to = "/cumplimiento"
  status = 301

[[redirects]]
  from = "/responsabilidad"
  to = "/cumplimiento"
  status = 301

[[redirects]]
  from = "/capital/"
  to = "/cumplimiento"
  status = 301

[[redirects]]
  from = "/capital"
  to = "/cumplimiento"
  status = 301

[[redirects]]
  from = "/sugerencias/"
  to = "/contacto"
  status = 301

[[redirects]]
  from = "/sugerencias"
  to = "/contacto"
  status = 301

# No equivalent content exists in the new IA for these two — 301 to the homepage rather than
# leaving them as dead links or redirecting to an unrelated page.
[[redirects]]
